name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require a released core dependency
        run: |
          python3 - <<'PYTHON'
          import json, subprocess
          module = json.loads(subprocess.check_output(['go', 'mod', 'edit', '-json']))
          version = next(x['Version'] for x in module['Require'] if x['Path'] == 'github.com/byteshuttle/allot')
          if version == 'v0.0.0' or module.get('Replace'):
              raise SystemExit('Pin a published core version and remove development replacements before release.')
          PYTHON
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 10m ./...
      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
      - name: Validate Registry release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/registry-release"
          python3 .github/scripts/release_checksums.py "$RUNNER_TEMP/registry-release"
      - name: Attest release artifacts with GitHub OIDC
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
      - name: Attach offline verification bundle to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" dist/provenance.sigstore.json
          gh release upload "$GITHUB_REF_NAME" dist/provenance.sigstore.json --repo "$GITHUB_REPOSITORY"
